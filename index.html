                '</div>' +
                '<div class="form-grid-4">' +
                  '<div><label class="form-label">인물 이름 *</label><input type="text" required name="author" class="field" style="width:100%;" placeholder="예: 에밀 시오랑" /></div>' +
                  '<div><label class="form-label">원어 이름 (선택)</label><input type="text" name="authorOriginal" class="field" style="width:100%;" placeholder="예: Emil Cioran" /></div>' +
                  '<div><label class="form-label">책 제목 *</label><input type="text" required name="work" class="field" style="width:100%;" placeholder="예: 해체의 교본" /></div>' +
                  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
                    '<div><label class="form-label">갈래</label><select name="category" class="field" style="width:100%;"><option value="philosopher">철학자</option><option value="novelist">소설가</option></select></div>' +
                    '<div><label class="form-label">형식</label><select name="workType" class="field" style="width:100%;"><option value="저서 발췌">저서 발췌</option><option value="소설 발췌">소설 발췌</option><option value="잠언 · 단상">잠언 · 단상</option><option value="수필 · 서한">수필 · 서한</option></select></div>' +
                  '</div>' +
                '</div>' +
                '<div style="margin-top:12px;">' +
                  '<label class="form-label">발췌할 문장 *</label>' +
                  '<textarea required rows="2" name="text" class="field" style="width:100%;" placeholder="책에서 인상 깊었던 한 문장을 그대로 옮겨 적어주세요."></textarea>' +
                '</div>' +
                '<div style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;">' +
                  '<div style="flex:1;min-width:220px;"><label class="form-label">짧은 메모 또는 맥락 (선택)</label><input type="text" name="context" class="field" style="width:100%;" placeholder="어느 장에서 읽었는지 혹은 남기고 싶은 단상" /></div>' +
                  '<button type="submit" class="btn-primary">서가에 추가하기</button>' +
                '</div>' +
              '</form>'
            : '';

          var listHtml = filtered.length === 0
            ? '<div style="padding:40px 0;text-align:center;font-size:0.875rem;color:var(--ink-muted);">일치하는 작가나 작품이 없습니다.</div>'
            : filtered.map(function (a) {
                var cnt = allPassages.filter(function (p) { return p.authorId === a.id; }).length;
                var inspecting = activeAuthor && activeAuthor.id === a.id;
                var locked = state.selectedAuthorId === a.id;
                return (
                  '<button type="button" class="author-row-btn' + (inspecting ? ' is-inspecting' : '') + '" data-action="inspect-author" data-id="' + escapeHtml(a.id) + '">' +
                    '<div style="min-width:0;">' +
                      '<div style="display:flex;align-items:center;gap:6px;">' +
                        '<span class="truncate" style="font-weight:500;color:var(--ink-primary);">' + escapeHtml(a.name) + '</span>' +
                        (locked ? '<span style="font-size:0.75rem;color:var(--accent-primary);font-weight:500;flex-shrink:0;">· 발췌 중</span>' : '') +
                      '</div>' +
                      '<div class="truncate" style="margin-top:4px;font-size:0.75rem;color:var(--ink-muted);">' +
                        (a.category === 'philosopher' ? '철학자' : '소설가') +
                        (a.originalName ? ' · ' + escapeHtml(a.originalName) : '') +
                        (a.era ? ' · ' + escapeHtml(a.era) : '') +

                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:0.75rem;color:var(--ink-muted);">' +
                      '<span class="font-mono-tabular">' + cnt + '문장</span>' +

                  '<div>' +
                    '<div style="font-size:0.75rem;color:var(--ink-muted);">' +
                      (activeAuthor.category === 'philosopher' ? '철학자' : '소설가') +
                      (activeAuthor.originalName ? ' · ' + escapeHtml(activeAuthor.originalName) : '') +

                          '<div id="studio-countdown" class="font-mono-tabular" style="font-size:1.5rem;font-weight:500;color:var(--ink-primary);margin-top:2px;">' + escapeHtml(statusReadout) + '</div>' +
                        '</div>' +
                        (state.scheduleMode === 'interval'
                          ? '<button type="button" class="' + (state.isTimerRunning ? 'btn-primary btn-sm' : 'btn-outline btn-sm') + '" data-action="toggle-timer">' +
                              iconSvg(state.isTimerRunning ? 'pause' : 'play', 14) +

                        '<select class="field field-xs" data-bind="studioCustomUnit">' +

                      '<div>' +

        function renderArchiveView() {
          var allPassages = getAllPassages();
          var savedList = state.savedIds
            .map(function (id) { return allPassages.find(function (p) { return p.id === id; }); })
            .filter(Boolean);

          var visible = savedList.filter(function (p) {
            return state.archiveScope === 'all' || p.category === state.archiveScope;
          });

          var bodyHtml = visible.length === 0
            ? '<div style="padding:72px 0;text-align:center;border-bottom:1px solid var(--border-hairline);">' +
                '<p class="font-editorial" style="margin:0;font-size:1.35rem;color:var(--ink-primary);">아직 보관된 문장이 없습니다.</p>' +
                '<p style="margin:8px 0 0;font-size:0.875rem;color:var(--ink-muted);">‘오늘의 발췌’ 화면에서 마음에 닿는 문장을 만나면 보관하기를 눌러보세요.</p>' +
                '<button type="button" class="btn-primary" style="margin-top:22px;" data-action="nav" data-view="desk">오늘의 발췌로 이동</button>' +

            : visible.map(function (p) {

                  '<article class="archive-row">' +
                    '<div style="max-width:740px;">' +
                      '<div style="font-size:0.75rem;color:var(--ink-muted);margin-bottom:8px;">' +
                        (p.category === 'philosopher' ? '철학자' : '소설가') + ' · ' + escapeHtml(p.author) + ' · 《' + escapeHtml(p.work) + '》' +
                      '</div>' +
                      '<blockquote class="font-editorial" style="margin:0;font-size:1.35rem;line-height:1.65;color:var(--ink-primary);">“' + escapeHtml(p.text) + '”</blockquote>' +
                      (p.context ? '<p style="margin:10px 0 0;font-size:0.84rem;color:var(--ink-muted);line-height:1.6;">' + escapeHtml(p.context) + '</p>' : '') +
                    '</div>' +
                    '<div class="action-group">' +
                      '<button type="button" class="btn-outline btn-sm" data-action="open-passage" data-id="' + escapeHtml(p.id) + '">' + iconSvg('book', 14) + '<span>펼쳐 읽기</span></button>' +
                      '<button type="button" class="btn-outline btn-sm" data-action="copy-archive" data-id="' + escapeHtml(p.id) + '">' +
                        iconSvg(isCopied ? 'check' : 'copy', 14) +
                        '<span style="' + (isCopied ? 'color:var(--accent-primary);' : '') + '">' + (isCopied ? '복사됨' : '복사') + '</span>' +
                      '</button>' +
                      '<button type="button" class="danger-btn" data-action="remove-saved" data-id="' + escapeHtml(p.id) + '" aria-label="보관함에서 제거">' + iconSvg('trash', 15) + '</button>' +
                    '</div>' +
                  '</article>'
                );
              }).join('');

          return (
            '<section class="container page-section">' +
              '<div class="page-header">' +
                '<div>' +
                  '<h1 class="page-title">문장 보관함</h1>' +
                  '<p class="page-subtitle">마음에 오래 남은 철학자와 소설가의 문장들을 모아두는 개인 서가입니다.</p>' +
                '</div>' +
                '<div class="segmented-inline">' +
                  '<button type="button" class="seg-btn' + (state.archiveScope === 'all' ? ' is-active' : '') + '" data-action="set-archive-scope" data-scope="all">전체 (' + savedList.length + ')</button>' +
                  '<button type="button" class="seg-btn' + (state.archiveScope === 'philosopher' ? ' is-active' : '') + '" data-action="set-archive-scope" data-scope="philosopher">철학자</button>' +

                '</div>' +
              '</div>' +
              '<div>' + bodyHtml + '</div>' +
            '</section>'
          );

        function renderFooter() {
          var authorsCount = getAllAuthors().length;
          var passagesCount = getAllPassages().length;
          return (
            '<footer class="site-footer">' +
              '<div class="container footer-inner">' +
                '<span>사유의 서가 · 철학자와 소설가의 문장 발췌</span>' +
                '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;">' +
                  '<span class="font-mono-tabular">수록 ' + authorsCount + '인 · ' + passagesCount + '문장</span>' +
                  '<span aria-hidden="true" style="color:var(--border-hairline);">|</span>' +
                  '<button type="button" class="text-link-btn" style="color:var(--accent-primary);font-weight:500;" data-action="download-html">' +
                    iconSvg('download', 13) +
                    '<span>index.html 다운로드</span>' +
                  '</button>' +
                  '<button type="button" class="text-link-btn" data-action="copy-html">' +
                    iconSvg(state.copiedSource ? 'check' : 'copy', 13) +
                    '<span>' + (state.copiedSource ? '소스 복사됨' : 'HTML 코드 복사') + '</span>' +
                  '</button>' +
                '</div>' +
              '</div>' +
            '</footer>'
          );
        }

        var lastRenderedPassageId = null;

        function render() {
          var appEl = document.getElementById('app');
          if (!appEl) return;

          // Preserve active search input focus/cursor across renders
          var activeEl = document.activeElement;
          var activeId = activeEl && activeEl.id ? activeEl.id : null;
          var selStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;

          var currentPassage = getCurrentPassage();
          var animatePassage = lastRenderedPassageId !== currentPassage.id;
          lastRenderedPassageId = currentPassage.id;

          var mainHtml = '';
          if (state.activeView === 'desk') mainHtml = renderDeskView(animatePassage);
          else if (state.activeView === 'authors') mainHtml = renderAuthorsView();
          else if (state.activeView === 'schedule') mainHtml = renderScheduleView();
          else if (state.activeView === 'archive') mainHtml = renderArchiveView();

          appEl.innerHTML = renderHeader() + '<main>' + mainHtml + '</main>' + renderFooter();

          if (activeId) {
            var restored = document.getElementById(activeId);
            if (restored) {
              restored.focus();
              if (selStart !== null && typeof restored.setSelectionRange === 'function') {
                try {
                  restored.setSelectionRange(selStart, selStart);
                } catch (e) {
                  // ignore
                }
              }
            }
          }
        }

        // Fast DOM-only countdown update every second (avoids full re-render flicker)
        function updateCountdownsOnly() {
          if (state.activeView === 'desk') {
            if (state.scheduleMode === 'interval') {
              var el = document.getElementById('desk-countdown');
              var bar = document.getElementById('desk-progress');
              if (el) el.textContent = formatDurationSeconds(state.secondsRemaining);
              if (bar && state.intervalSeconds > 0) {
                var pct = Math.min(100, Math.max(0, ((state.intervalSeconds - state.secondsRemaining) / state.intervalSeconds) * 100));
                bar.style.width = pct + '%';
              }
            } else {
              var schedEl = document.getElementById('desk-sched-countdown');
              var nextInfo = getNextScheduledInfo();
              if (schedEl) {
                schedEl.textContent = nextInfo ? formatDurationSeconds(nextInfo.secondsUntil) : '--:--:--';
              }
            }
          } else if (state.activeView === 'schedule') {
            var studioEl = document.getElementById('studio-countdown');
            if (studioEl) {
              if (state.scheduleMode === 'interval') {
                studioEl.textContent = formatDurationSeconds(state.secondsRemaining);
              } else {
                var next = getNextScheduledInfo();
                studioEl.textContent = next
                  ? '다음 ' + next.time + ' (' + formatDurationSeconds(next.secondsUntil) + ')'
                  : '예약된 시각 없음';
              }
            }
          }
        }

        // =========================================================================
        // 8. Event Delegation (Clicks, Inputs, Forms)
        // =========================================================================
        var appRoot = document.getElementById('app');

        appRoot.addEventListener('click', function (e) {
          var target = e.target.closest('[data-action]');
          if (!target) return;
          var action = target.getAttribute('data-action');
          var id = target.getAttribute('data-id');

          switch (action) {
            case 'nav':
              state.activeView = target.getAttribute('data-view') || 'desk';
              render();
              break;
            case 'top-draw':
              drawNextPassage('manual');
              if (state.activeView !== 'desk') {
                state.activeView = 'desk';
                render();
              }
              break;
            case 'next-passage':
              drawNextPassage('manual');
              break;
            case 'prev-passage':
              if (state.historyIndex > 0) {
                state.historyIndex -= 1;
                state.copiedDesk = false;
                render();
              }
              break;
            case 'copy-desk': {
              var cur = getCurrentPassage();
              var txt = '"' + cur.text + '" — ' + cur.author + ', 《' + cur.work + '》';
              copyTextSafe(txt, function () {
                state.copiedDesk = true;
                render();
                setTimeout(function () {
                  state.copiedDesk = false;
                  render();
                }, 1700);
              });
              break;
            }
            case 'toggle-save':
              if (id) toggleSave(id);
              break;
            case 'toggle-context':
              state.showContext = !state.showContext;
              render();
              break;
            case 'toggle-dark':
              state.isDark = !state.isDark;
              applyTheme();
              safeWriteJson(STORAGE_KEYS.DARK_MODE, state.isDark);
              render();
              break;
            case 'dismiss-notice':
              state.arrivalNotice = null;
              render();
              break;
            case 'reset-scope':
              state.filterScope = 'all';
              selectAuthor(null);
              break;
            case 'set-sched-mode':
              state.scheduleMode = target.getAttribute('data-mode') || 'interval';
              safeWriteJson(STORAGE_KEYS.SCHEDULE_MODE, state.scheduleMode);
              render();
              break;
            case 'toggle-timer':
              state.isTimerRunning = !state.isTimerRunning;
              render();
              break;
            case 'set-interval': {
              var sec = parseInt(target.getAttribute('data-sec'), 10);
              if (!isNaN(sec)) setIntervalSeconds(sec);
              break;
            }
            case 'studio-set-interval': {
              var sSec = parseInt(target.getAttribute('data-sec'), 10);
              if (!isNaN(sSec)) {
                state.scheduleMode = 'interval';
                safeWriteJson(STORAGE_KEYS.SCHEDULE_MODE, 'interval');
                setIntervalSeconds(sSec);
              }
              break;
            }
            case 'toggle-sched':
              if (id) toggleScheduledTime(id);
              break;
            case 'remove-sched':
              if (id) removeScheduledTime(id);
              break;
            case 'toggle-sound':
              state.soundEnabled = !state.soundEnabled;
              safeWriteJson(STORAGE_KEYS.SOUND_ENABLED, state.soundEnabled);
              render();
              break;
            case 'preview-chime':
              playGentleChime();
              break;
            case 'toggle-notif':
              toggleNotifications();
              break;
            case 'set-scope':
              changeFilterScope(target.getAttribute('data-scope') || 'all');
              break;
            case 'select-author': {
              var nextAuthor = id || null;
              selectAuthor(nextAuthor === state.selectedAuthorId ? null : nextAuthor);
              break;
            }
            case 'toggle-add-form':
              state.dirShowAddForm = !state.dirShowAddForm;
              render();
              break;
            case 'set-dir-scope':
              state.dirScope = target.getAttribute('data-scope') || 'all';
              render();
              break;
            case 'inspect-author':
              state.dirExpandedAuthorId = id;
              render();
              break;
            case 'lock-author-read':
              if (id) {
                state.activeView = 'desk';
                selectAuthor(id);
              }
              break;
            case 'open-passage':
              if (id) openSpecificPassage(id);
              break;
            case 'delete-custom':
              if (id) {
                state.customPassages = state.customPassages.filter(function (p) { return p.id !== id; });
                state.savedIds = state.savedIds.filter(function (sid) { return sid !== id; });
                safeWriteJson(STORAGE_KEYS.CUSTOM_PASSAGES, state.customPassages);
                safeWriteJson(STORAGE_KEYS.SAVED_IDS, state.savedIds);
                render();
              }
              break;
            case 'clear-log':
              state.deliveryLog = [];
              safeWriteJson(STORAGE_KEYS.DELIVERY_LOG, []);
              render();
              break;
            case 'set-archive-scope':
              state.archiveScope = target.getAttribute('data-scope') || 'all';
              render();
              break;
            case 'copy-archive': {
              var found = getAllPassages().find(function (p) { return p.id === id; });
              if (found) {
                var formatted = '"' + found.text + '" — ' + found.author + ', 《' + found.work + '》';
                copyTextSafe(formatted, function () {
                  state.copiedArchiveId = found.id;
                  render();
                  setTimeout(function () {
                    state.copiedArchiveId = null;
                    render();
                  }, 1600);
                });
              }
              break;
            }
            case 'remove-saved':
              if (id) {
                state.savedIds = state.savedIds.filter(function (item) { return item !== id; });
                safeWriteJson(STORAGE_KEYS.SAVED_IDS, state.savedIds);
                render();
              }
              break;
            case 'download-html':
              downloadStandaloneHtml();
              break;
            case 'copy-html':
              copyStandaloneHtml();
              break;
          }
        });

        appRoot.addEventListener('input', function (e) {
          var el = e.target;
          var bind = el.getAttribute('data-bind');
          if (!bind) return;
          state[bind] = el.value;
          if (bind === 'deskAuthorQuery' || bind === 'dirQuery') {
            render();
          }
        });

        appRoot.addEventListener('change', function (e) {
          var el = e.target;
          var bind = el.getAttribute('data-bind');
          if (!bind) return;
          state[bind] = el.value;
        });

        appRoot.addEventListener('submit', function (e) {
          e.preventDefault();
          var form = e.target;
          var formType = form.getAttribute('data-form');

          if (formType === 'desk-custom-interval') {
            var num = parseInt(state.deskCustomValue, 10);
            if (!isNaN(num) && num > 0) {
              var total = state.deskCustomUnit === 'min' ? num * 60 : num;
              setIntervalSeconds(total);
            }
          } else if (formType === 'studio-custom-interval') {
            var sNum = parseInt(state.studioCustomVal, 10);
            if (!isNaN(sNum) && sNum > 0) {
              var sTotal = state.studioCustomUnit === 'min' ? sNum * 60 : sNum;
              state.scheduleMode = 'interval';
              safeWriteJson(STORAGE_KEYS.SCHEDULE_MODE, 'interval');
              setIntervalSeconds(sTotal);
            }
          } else if (formType === 'desk-add-time') {
            addScheduledTime(state.deskNewTime, '맞춤 시각');
          } else if (formType === 'studio-add-time') {
            addScheduledTime(state.studioTimeInput, state.studioLabelInput.trim() || '정시 발췌');
            state.studioLabelInput = '';
            render();
          } else if (formType === 'add-custom-passage') {
            var fd = new FormData(form);
            var author = String(fd.get('author') || '').trim();
            var authorOriginal = String(fd.get('authorOriginal') || '').trim();
            var work = String(fd.get('work') || '').trim();
            var category = String(fd.get('category') || 'philosopher');
            var workType = String(fd.get('workType') || '저서 발췌');
            var text = String(fd.get('text') || '').trim();
            var context = String(fd.get('context') || '').trim();
            if (!author || !work || !text) return;

            var existingAuthor = getAllAuthors().find(function (a) {
              return a.name.toLowerCase() === author.toLowerCase();
            });
            var authorId = existingAuthor
              ? existingAuthor.id
              : 'custom-' + author.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now();

            var newPassage = {
              id: 'custom-p-' + Date.now(),
              text: text,
              authorId: authorId,
              author: author,
              authorOriginal: authorOriginal,
              era: existingAuthor ? existingAuthor.era : '사용자 서가',
              category: category === 'novelist' ? 'novelist' : 'philosopher',
              work: work,
              workType: workType,
              context: context,
              isCustom: true
            };

            state.customPassages = [newPassage].concat(state.customPassages);
            safeWriteJson(STORAGE_KEYS.CUSTOM_PASSAGES, state.customPassages);
            state.dirShowAddForm = false;
            openSpecificPassage(newPassage.id);
          }
        });

        // =========================================================================
        // 9. Master 1-Second Clock
        // =========================================================================
        window.setInterval(function () {
          var now = new Date();

          if (state.scheduleMode === 'interval' && state.isTimerRunning) {
            if (state.secondsRemaining <= 1) {
              drawNextPassage('interval', null, '설정한 주기가 되어 새 문장이 도착했습니다.');
              return;
            } else {
              state.secondsRemaining -= 1;
              updateCountdownsOnly();
            }
          }

          if (state.scheduleMode === 'scheduled_times') {
            var hh = String(now.getHours()).padStart(2, '0');
            var mm = String(now.getMinutes()).padStart(2, '0');
            var currentHHMM = hh + ':' + mm;
            var dateKey = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate() + ' ' + currentHHMM;

            if (lastTriggeredMinute !== dateKey) {
              var matched = state.scheduledTimes.find(function (entry) {
                return entry.enabled && entry.time === currentHHMM;
              });
              if (matched) {
                lastTriggeredMinute = dateKey;
                drawNextPassage(
                  'scheduled',
                  null,
                  '예약된 시각(' + matched.time + ' · ' + matched.label + ')의 새 문장이 도착했습니다.'
                );
                return;
              }
            }
            updateCountdownsOnly();
          }
        }, 1000);

        // Initial render
        render();
      })();
    </script>
